[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-monitoring-toolkit"
dynamic = ["version"]
description = "Inventory-driven network monitoring toolkit: TCP, DNS and ICMP checks with SQLite history and JSON/CSV reports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehrad Esmi" }]
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.dynamic]
version = { attr = "network_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]